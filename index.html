<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OilBay Service Notification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }

        h1 {
            color: #1e3a8a;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .whatsapp-btn {
            background-color: #25D366;
            color: white;
        }

        .whatsapp-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .note {
            margin-top: 10px;
            font-size: 13px;
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OilBay</h1>
    <p>Enter Customer Phone Number:</p>

    <input type="text" id="phone" placeholder="Enter 8-digit number" maxlength="8" oninput="validateNumber()">

    <button id="whatsappBtn" class="whatsapp-btn" onclick="sendWhatsApp()" disabled>
        Send WhatsApp Message
    </button>

    <div class="note" id="errorMsg"></div>
</div>

<script>
function validateNumber() {
    const phone = document.getElementById("phone").value;
    const button = document.getElementById("whatsappBtn");
    const errorMsg = document.getElementById("errorMsg");

    // Allow only numbers
    if (!/^\d*$/.test(phone)) {
        errorMsg.textContent = "Only numbers are allowed.";
        button.disabled = true;
        return;
    }

    // Check if exactly 8 digits
    if (phone.length === 8) {
        errorMsg.textContent = "";
        button.disabled = false;
    } else {
        errorMsg.textContent = "Phone number must be exactly 8 digits.";
        button.disabled = true;
    }
}

function sendWhatsApp() {
    const phone = document.getElementById("phone").value;

    const message = `تم الانتهاء من خدمة تغيير زيت المحرك وفلتر الزيت لسيارتكم، يرجى التوجه لاستلام المركبة.
Your car oil and filter service is finished. Please proceed to collect your vehicle.`;

    const encodedMessage = encodeURIComponent(message);

    // Kuwait country code +965
    const whatsappURL = `https://wa.me/965${phone}?text=${encodedMessage}`;

    window.open(whatsappURL, "_blank");
}
</script>

</body>
</html>
