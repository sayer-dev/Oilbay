<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OilBay Service Notification</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 20px;
}
h2 {
    text-align: center;
    color: #1e3a8a;
}
table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}
th {
    background-color: #e9ecef;
}
input {
    width: 90%;
    padding: 5px;
    font-size: 14px;
}
button {
    padding: 6px 10px;
    font-size: 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.whatsapp {
    background-color: #25D366;
    color: white;
}
.whatsapp:disabled {
    background-color: #999;
    cursor: not-allowed;
}
.clear {
    background-color: #dc3545;
    color: white;
}
</style>
</head>
<body>

<h2>Oil Change Bay Notification</h2>

<table>
<thead>
<tr>
    <th>Plate No</th>
    <th>Mobile Number</th>
    <th>WhatsApp</th>
    <th>Clear</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>
const COUNTRY_CODE = "965";
const MESSAGE = `تم الانتهاء من خدمة تغيير زيت المحرك وفلتر الزيت لسيارتكم، يرجى التوجه لاستلام المركبة.
Your car oil and filter service is finished. Please proceed to collect your vehicle.`;

const tbody = document.getElementById("tableBody");

// Create 10 rows
for (let i = 0; i < 10; i++) {
    const row = document.createElement("tr");
    row.innerHTML = `
        <td><input type="text" placeholder="Plate"></td>
        <td><input type="tel" placeholder="8-digit number"></td>
        <td><button class="whatsapp" disabled>WhatsApp</button></td>
        <td><button class="clear">Clear</button></td>
    `;
    tbody.appendChild(row);
}

// Enable/disable WhatsApp button based on 8-digit validation
tbody.addEventListener("input", function(e) {
    if (e.target.type === "tel") {
        const row = e.target.closest("tr");
        const phone = e.target.value.replace(/\D/g,"");
        const btn = row.querySelector(".whatsapp");
        btn.disabled = phone.length !== 8;
    }
});

// Button actions
tbody.addEventListener("click", function(e) {
    const btn = e.target;
    const row = btn.closest("tr");

    if (btn.classList.contains("whatsapp")) {
        const phone = row.children[1].children[0].value.replace(/\D/g,"");
        if (phone.length !== 8) return;
        const encodedMessage = encodeURIComponent(MESSAGE);
        const whatsappURL = `https://wa.me/${COUNTRY_CODE}${phone}?text=${encodedMessage}`;
        window.open(whatsappURL, "_blank");
    }

    if (btn.classList.contains("clear")) {
        row.querySelectorAll("input").forEach(i => i.value = "");
        row.querySelector(".whatsapp").disabled = true;
    }
});
</script>

</body>
</html>
